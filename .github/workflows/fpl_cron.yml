name: Toxic 90 FPL Autonomous Monitor

on:
  schedule:
    # Runs every 20 minutes (3 times per hour: :00, :20, :40) to eliminate queue delays
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI / gh CLI
    inputs:
      mode:
        description: 'Action mode to execute'
        required: false
        default: 'newsletter'
        type: choice
        options:
          - newsletter
          - deadline
          - concluded
          - poll_cycle
      gameweek:
        description: 'Gameweek ID (optional, defaults to 10)'
        required: false
        default: '10'

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit state.json and docs/ back to repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Database Driver
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install --no-cache-dir psycopg2-binary pg8000

      - name: Run FPL Monitor CLI
        env:
          FORCE_TRIGGER: ${{ github.event.inputs.mode || inputs.mode || 'poll_cycle' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DB_URL }}
        run: |
          python main.py --gw ${{ github.event.inputs.gameweek || inputs.gameweek || '10' }}

      - name: Persist State & Web Archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update FPL monitor state and web archive [skip ci]" && git push)
